services:
  frontend:
    build: ./website
    container_name: orcs_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./website:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: orcs_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST=db
      - AWS_S3_ENDPOINT=http://minio:9000
      - AWS_S3_BUCKET=orcs-deployments
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - SITE_BASE_DOMAIN=localhost:3000
      # Dynamic apps publish a port on the docker host, which the backend proxies to
      - RUNTIME_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres
    container_name: orcs_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orcs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations/000001_init_mg.up.sql:/docker-entrypoint-initdb.d/000001_init_mg.up.sql
      - ./backend/database/migrations/000002_update_user_table.up.sql:/docker-entrypoint-initdb.d/000002_update_user_table.up.sql
      - ./backend/database/migrations/000003_deployment.up.sql:/docker-entrypoint-initdb.d/000003_deployment.up.sql
      - ./backend/database/migrations/000004_deployment_container.up.sql:/docker-entrypoint-initdb.d/000004_deployment_container.up.sql
      - ./backend/database/migrations/000005_deployment_config.up.sql:/docker-entrypoint-initdb.d/000005_deployment_config.up.sql
      - ./backend/database/migrations/000006_deployment_runtime.up.sql:/docker-entrypoint-initdb.d/000006_deployment_runtime.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orcs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: orcs_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
